# Runs the tests, exports the web build and publishes it to GitHub Pages on
# every push to main (or by hand from the Actions tab).
name: Web build to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; a newer push cancels an older run still in progress.
concurrency:
  group: pages
  cancel-in-progress: true

env:
  GODOT_VERSION: 4.7.2
  GODOT_RELEASE: 4.7.2-stable

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot and the web export template
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_RELEASE }}-web

      - name: Install Godot ${{ env.GODOT_VERSION }}
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          base="https://github.com/godotengine/godot-builds/releases/download/${GODOT_RELEASE}"
          mkdir -p ~/godot
          curl -sSL -o /tmp/godot.zip "$base/Godot_v${GODOT_RELEASE}_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d ~/godot
          mv ~/godot/Godot_v${GODOT_RELEASE}_linux.x86_64 ~/godot/godot
          # The full template pack is ~1.2 GB; keep only the single-threaded web template.
          curl -sSL -o /tmp/templates.tpz "$base/Godot_v${GODOT_RELEASE}_export_templates.tpz"
          dest=~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          mkdir -p "$dest"
          unzip -q -j /tmp/templates.tpz "templates/web_nothreads_release.zip" "templates/version.txt" -d "$dest"
          rm /tmp/templates.tpz

      # A first import of a fresh checkout logs errors (the theme loads before
      # its font is imported) and can stop early; a second pass finishes it.
      - name: Import the project
        run: |
          ~/godot/godot --headless --path . --import || true
          ~/godot/godot --headless --path . --import || true

      - name: Run tests
        run: |
          ~/godot/godot --headless --path . -s addons/gut/gut_cmdln.gd 2>&1 | tee test.log
          if grep -qE "SCRIPT ERROR|Parse Error|Failed to load script" test.log; then
            # Annotations are readable without signing in, unlike the log.
            grep -A2 -E "SCRIPT ERROR|Parse Error|Failed to load script" test.log | head -30 | while IFS= read -r line; do
              echo "::error::$line"
            done
            echo "::error::Script errors in the test run"; exit 1
          fi
          grep -q "All tests passed" test.log

      - name: Export the web build
        run: |
          mkdir -p build/web
          ~/godot/godot --headless --path . --export-release Web build/web/index.html
          test -s build/web/index.pck
          # New file names every deploy, so browsers never run a cached old build.
          python3 tools/cache_bust.py build/web "${GITHUB_SHA::7}"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
